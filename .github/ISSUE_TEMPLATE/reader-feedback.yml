name: Reader feedback
description: Suggest a correction or report an accessibility issue on the site.
title: "Reader feedback: "
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form creates a public GitHub issue. An automated workflow also copies it to `docs/reader-feedback.csv` in this public repository, where anyone can read it. GitHub requires an account to submit. Please do not include personal, medical, or other private information.
  - type: dropdown
    id: feedback_type
    attributes:
      label: Type of feedback
      options:
        - Correction or source issue
        - Accessibility barrier
        - Other suggestion
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link to the page or section, if applicable.
      placeholder: https://learnaboutjainism.com/en/...
  - type: textarea
    id: feedback
    attributes:
      label: What should we review?
      description: Describe the correction, accessibility barrier, or improvement you suggest.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting source or context
      description: Share a source, edition and location, relevant tradition, or steps to reproduce an accessibility issue.
